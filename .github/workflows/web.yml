name: Web build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Compile desktop
        run: ./gradlew --no-daemon desktop:compileJava

      - name: Build web (release)
        run: ./gradlew --no-daemon web:gdx_teavm_web_js_release_build

      - name: Drop server-only files
        run: rm -rf web/build/dist/js/release/webapp/WEB-INF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build/dist/js/release/webapp

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
