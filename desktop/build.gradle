import org.gradle.internal.os.OperatingSystem

apply plugin: 'application'

sourceSets.main.java.srcDirs = ['src/']

def assetsDir = rootProject.file('assets')

application {
    mainClass = 'com.buran.game.desktop.DesktopLauncher'
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-desktop:$gdxControllersVersion"
}

tasks.named('run', JavaExec) {
    workingDir = assetsDir
    ignoreExitValue = true
    if (OperatingSystem.current().isMacOsX()) {
        jvmArgs += '-XstartOnFirstThread'
    }
}

// Regenerates the pre-rendered bitmap fonts in assets/fonts from the TTF.
// Web builds cannot run FreeType at load time cheaply, so fonts ship as .fnt + .png.
configurations { fontgen }
dependencies {
    fontgen "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    fontgen "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
    fontgen "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
}
sourceSets {
    fontgen {
        java.srcDirs = ['fontgen/']
        compileClasspath += configurations.fontgen
        runtimeClasspath += configurations.fontgen
    }
}
dependencies {
    fontgen "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
    fontgen "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}
tasks.register('generateFonts', JavaExec) {
    group = 'build'
    description = 'Pre-renders assets/fonts/*.fnt from the TTF font'
    mainClass = 'com.buran.game.fontgen.FontGenerator'
    classpath = sourceSets.fontgen.runtimeClasspath
    args assetsDir.absolutePath
}
