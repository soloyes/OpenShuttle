allprojects {
    version = '4.0.0'
    ext {
        appName = 'Buran-19'
    }
    repositories {
        mavenCentral()
        maven { url = 'https://teavm.org/maven/repository/' }
    }
}

subprojects {
    apply plugin: 'java'

    // Any JDK 17+ can build; bytecode targets 17 for TeaVM.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }
}
