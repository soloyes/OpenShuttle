<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Buran-19</title>
    <style>
        @font-face {
            font-family: "College";
            src: url("assets/fonts/college.regular.ttf") format("truetype");
            font-display: block;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #04050c;
            color: #e8eef7;
        }
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }
        #boot {
            position: fixed;
            inset: 0;
            z-index: 10;
            cursor: pointer;
            user-select: none;
            overflow: hidden;
            background: #04050c;
            transition: opacity 0.9s ease;
        }
        /* Phones: tap instead of A, no gamepad legend. */
        body.touch #hint { display: none; }
        body.touch .pad-only { display: none; }
        body:not(.touch) .touch-only { display: none; }
        #boot.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #scene {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        #panel, #hint {
            transition: opacity 0.35s ease;
        }
        #boot.launch #panel, #boot.launch #hint {
            opacity: 0;
        }
        #boot.launch {
            cursor: default;
        }
        :root {
            /* One unit that fits both TV landscape and phone portrait. */
            --u: min(1vh, 1.6vw);
        }
        #panel {
            position: absolute;
            left: max(6vw, 24px);
            right: max(6vw, 24px);
            top: 50%;
            transform: translateY(-50%);
        }
        #title {
            font-family: "College", "Segoe UI", sans-serif;
            font-size: calc(var(--u) * 15);
            white-space: nowrap;
            line-height: 0.9;
            letter-spacing: 0.02em;
            margin: 0;
            color: #f2f5fa;
            text-shadow: 0 0 40px rgba(120, 180, 255, 0.25);
        }
        #subtitle {
            font-family: "College", "Segoe UI", sans-serif;
            font-size: calc(var(--u) * 3.4);
            letter-spacing: 0.35em;
            white-space: nowrap;
            margin: calc(var(--u) * 1.6) 0 calc(var(--u) * 5) calc(var(--u) * 0.4);
            color: #9fb3cc;
        }
        #telemetry {
            font-family: Consolas, "Courier New", monospace;
            font-size: calc(var(--u) * 2.1);
            line-height: 1.7;
            color: #6f86a3;
            min-height: calc(var(--u) * 12);
            white-space: pre;
        }
        #telemetry .ok {
            color: #7fd3a8;
        }
        #bar {
            width: min(34vw, 100%);
            height: 2px;
            margin-top: calc(var(--u) * 3);
            background: rgba(159, 179, 204, 0.18);
            position: relative;
            overflow: hidden;
        }
        #bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: -30%;
            width: 30%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #9fd0ff, transparent);
            animation: scan 1.6s linear infinite;
        }
        #boot.ready #bar::after {
            animation: none;
            left: 0;
            width: 100%;
            background: #9fd0ff;
        }
        @keyframes scan {
            to { left: 100%; }
        }
        #press {
            font-family: "College", "Segoe UI", sans-serif;
            font-size: calc(var(--u) * 3.6);
            letter-spacing: 0.12em;
            white-space: nowrap;
            margin-top: calc(var(--u) * 5);
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #soundnote {
            font-family: Consolas, "Courier New", monospace;
            font-size: calc(var(--u) * 1.7);
            color: #4f6480;
            margin-top: calc(var(--u) * 1.6);
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #boot.ready #soundnote { opacity: 1; }
        #boot.ready #press {
            opacity: 1;
            animation: breathe 2.2s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.55; }
            50% { opacity: 1; }
        }
        .btn {
            display: inline-block;
            width: 1.55em;
            height: 1.55em;
            margin: 0 0.3em;
            vertical-align: -0.42em;
        }
        #hint {
            position: absolute;
            left: max(6vw, 24px);
            right: max(6vw, 24px);
            bottom: 6vh;
            font-family: Consolas, "Courier New", monospace;
            font-size: calc(var(--u) * 1.8);
            color: #4f6480;
            line-height: 1.7;
        }
    </style>
</head>
<body oncontextmenu="return false">
<canvas id="canvas" tabindex="0"></canvas>
<div id="boot" role="button" tabindex="0">
    <canvas id="scene"></canvas>
    <div id="panel">
        <h1 id="title">BURAN-19</h1>
        <div id="subtitle">THE LAST FLIGHT &middot; 1991</div>
        <div id="telemetry"></div>
        <div id="bar"></div>
        <div id="press"><span class="touch-only">TAP TO START</span><span class="pad-only">PRESS <svg class="btn" viewBox="0 0 40 40" aria-label="A"><circle cx="20" cy="20" r="19" fill="#107c10"/><path d="M20 10 L28.5 30 H24.6 L22.9 25.6 H17.1 L15.4 30 H11.5 Z M18.3 22.4 H21.7 L20 17.8 Z" fill="#fff" fill-rule="evenodd"/></svg> TO START</span></div>
        <div id="soundnote">SOUND STARTS WITH THE FIRST PRESS</div>
    </div>
    <div id="hint">
        LEFT STICK fly &middot; A use / select &middot; LB RB switch item &middot; Y EMP pulse &middot; MENU pause
    </div>
</div>
<script>
    // On Xbox, B is the browser "Back" button. Keep the game page on top of the history stack.
    history.pushState({ game: true }, "", location.href);
    window.addEventListener("popstate", function () {
        history.pushState({ game: true }, "", location.href);
    });

    var boot = document.getElementById("boot");
    if (window.matchMedia && matchMedia("(pointer: coarse)").matches && navigator.maxTouchPoints > 0) {
        document.body.classList.add("touch");
    }

    // Telemetry: flavour lines while the game downloads.
    var lines = [
        "BAIKONUR UPLINK ............",
        "GYROSCOPES .................",
        "LIFE SUPPORT ...............",
        "TRANSPONDER, CREW 5 ........",
        "OBJECT-19 TELEMETRY ........"
    ];
    var tele = document.getElementById("telemetry");
    var shown = [];
    var step = 0;
    var ready = false;
    function tick() {
        if (step < lines.length) {
            shown.push(lines[step] + " <span class=\"ok\">OK</span>");
            step++;
        } else if (!ready) {
            return;
        }
        tele.innerHTML = shown.slice(-4).join("\n");
    }
    var teleTimer = setInterval(function () {
        tick();
        if (step >= lines.length) clearInterval(teleTimer);
    }, 700);

    // Called by the game (WebLauncher) once assets are in and the first screen is up.
    window.onGameReady = function () {
        ready = true;
        while (step < lines.length) tick();
        shown.push("MISSION CONTROL ............ <span class=\"ok\">NO SIGNAL</span>");
        tele.innerHTML = shown.slice(-4).join("\n");
        boot.classList.add("ready");
    };

    var started = false;
    function begin() {
        if (started || !ready) return;
        started = true;
        if (window.__introPending) {
            // First run: the intro opens with the launch itself, so go straight to it.
            boot.classList.add("hidden");
        } else {
            boot.classList.add("launch");
        // First the music fades out, then the engines spool up and the launch plays.
        LaunchAudio.fadeOutMusic(900);
        setTimeout(function () {
            LaunchAudio.play();
            Scene.launch(function () {
                boot.classList.add("hidden");
                LaunchAudio.restoreMusic();
            });
        }, 900);
        }
        // The game ignores pad input until the button that dismissed this overlay is released.
        window.__gameStarted = true;
        var el = document.documentElement;
        var fs = el.requestFullscreen || el.webkitRequestFullscreen;
        if (fs) {
            try {
                var p = fs.call(el);
                if (p && p.catch) p.catch(function () {});
            } catch (e) {}
        }
        // The click is the user gesture browsers need before audio can play.
        if (window.Howler && Howler.ctx && Howler.ctx.state === "suspended") {
            Howler.ctx.resume();
        }
        document.getElementById("canvas").focus();
    }
    boot.addEventListener("click", begin);
    window.addEventListener("keydown", function (e) {
        if (!started && (e.key === "Enter" || e.key === " ")) begin();
    });

    // If the controller drives the page directly (no Edge mouse cursor), A also starts.
    (function pollPad() {
        if (started) return;
        var pads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (var i = 0; i < pads.length; i++) {
            if (pads[i] && pads[i].buttons[0] && pads[i].buttons[0].pressed) { begin(); break; }
        }
        requestAnimationFrame(pollPad);
    })();

    window.addEventListener("load", function () {
        main();
    });

    /*
     * Launch sound, synthesised with Web Audio: engine ignition rumble, a rising whoosh as the
     * shuttle passes the camera, a deep thud on the flash and a fading tail. The game music is
     * ducked for the animation and brought back as the menu appears.
     */
    var LaunchAudio = (function () {
        function ctx() {
            return window.Howler && Howler.ctx ? Howler.ctx : null;
        }

        function noiseBuffer(c, seconds) {
            var len = Math.floor(c.sampleRate * seconds);
            var buf = c.createBuffer(1, len, c.sampleRate);
            var d = buf.getChannelData(0);
            var last = 0;
            for (var i = 0; i < len; i++) {
                // Brown-ish noise: deeper than white noise, better for rumble.
                last = (last + 0.04 * (Math.random() * 2 - 1)) / 1.04;
                d[i] = last * 3.5;
            }
            return buf;
        }

        function whiteBuffer(c, seconds) {
            var len = Math.floor(c.sampleRate * seconds);
            var buf = c.createBuffer(2, len, c.sampleRate);
            for (var ch = 0; ch < 2; ch++) {
                var d = buf.getChannelData(ch);
                for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
            }
            return buf;
        }

        // Synthetic hall: decaying stereo noise as an impulse response.
        function reverb(c, seconds, decay) {
            var len = Math.floor(c.sampleRate * seconds);
            var ir = c.createBuffer(2, len, c.sampleRate);
            for (var ch = 0; ch < 2; ch++) {
                var d = ir.getChannelData(ch);
                for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
            }
            var cv = c.createConvolver();
            cv.buffer = ir;
            return cv;
        }

        // Soft saturation: gives the engine noise body instead of hiss.
        function saturator(c, amount) {
            var ws = c.createWaveShaper();
            var n = 1024, curve = new Float32Array(n);
            for (var i = 0; i < n; i++) {
                var x = i / (n - 1) * 2 - 1;
                curve[i] = Math.tanh(x * amount) / Math.tanh(amount);
            }
            ws.curve = curve;
            return ws;
        }

        function env(g, t, points) {
            g.gain.setValueAtTime(0.0001, t);
            points.forEach(function (p) { g.gain.exponentialRampToValueAtTime(Math.max(0.0001, p[1]), t + p[0]); });
        }

        function schedule(c) {
            var t = c.currentTime + 0.03;
            var master = c.createDynamicsCompressor();
            master.threshold.value = -16;
            master.ratio.value = 3;
            master.attack.value = 0.01;
            master.release.value = 0.4;
            var out = c.createGain();
            out.gain.value = 0.95;
            master.connect(out).connect(c.destination);
            var hall = reverb(c, 4.0, 2.6);
            var wet = c.createGain();
            wet.gain.value = 0.55;
            hall.connect(wet).connect(master);

            function send(node, dry, rev) {
                var d = c.createGain(); d.gain.value = dry; node.connect(d).connect(master);
                var r = c.createGain(); r.gain.value = rev; node.connect(r).connect(hall);
            }

            // 1) Ignition: a deep cough as the engines catch.
            var kick = c.createOscillator();
            kick.type = "sine";
            kick.frequency.setValueAtTime(70, t + 0.15);
            kick.frequency.exponentialRampToValueAtTime(30, t + 0.9);
            var kg = c.createGain();
            env(kg, t + 0.15, [[0.02, 0.7], [0.8, 0.0001]]);
            kick.connect(kg);
            send(kg, 0.9, 0.3);
            kick.start(t + 0.15); kick.stop(t + 1.1);

            // 2) Engine roar: brown noise, saturated, opening up as thrust builds, with a slow flutter.
            var roar = c.createBufferSource();
            roar.buffer = noiseBuffer(c, 3.6);
            var rlp = c.createBiquadFilter();
            rlp.type = "lowpass";
            rlp.Q.value = 0.7;
            rlp.frequency.setValueAtTime(90, t + 0.15);
            rlp.frequency.exponentialRampToValueAtTime(700, t + 1.4);
            rlp.frequency.exponentialRampToValueAtTime(2200, t + 2.1);
            rlp.frequency.exponentialRampToValueAtTime(200, t + 3.4);
            var rg = c.createGain();
            env(rg, t + 0.15, [[0.25, 0.35], [1.0, 0.8], [1.9, 0.9], [3.3, 0.0001]]);
            var flutter = c.createOscillator();
            flutter.frequency.value = 11;
            var fg = c.createGain();
            fg.gain.value = 0.12;
            flutter.connect(fg).connect(rg.gain);
            roar.connect(saturator(c, 2.5)).connect(rlp).connect(rg);
            send(rg, 0.8, 0.35);
            roar.start(t + 0.15); flutter.start(t + 0.15);
            flutter.stop(t + 3.6);

            // 3) Crackle: sparse impulses, the texture of a real rocket plume.
            var cb = c.createBuffer(1, Math.floor(c.sampleRate * 2.6), c.sampleRate);
            var cd = cb.getChannelData(0);
            for (var i = 0; i < cd.length; i++) cd[i] = Math.random() < 0.0018 ? (Math.random() * 2 - 1) : 0;
            var crack = c.createBufferSource();
            crack.buffer = cb;
            var chp = c.createBiquadFilter();
            chp.type = "highpass";
            chp.frequency.value = 1400;
            var cg = c.createGain();
            env(cg, t + 0.4, [[0.6, 0.5], [1.6, 0.6], [2.4, 0.0001]]);
            crack.connect(chp).connect(cg);
            send(cg, 0.6, 0.4);
            crack.start(t + 0.4);

            // 4) Pass-by: air tearing, sweeping across the stereo field with a Doppler drop.
            var air = c.createBufferSource();
            air.buffer = whiteBuffer(c, 2.0);
            var bp = c.createBiquadFilter();
            bp.type = "bandpass";
            bp.Q.value = 0.9;
            bp.frequency.setValueAtTime(300, t + 0.8);
            bp.frequency.exponentialRampToValueAtTime(1800, t + 1.95);
            bp.frequency.exponentialRampToValueAtTime(420, t + 2.6);
            var ag = c.createGain();
            env(ag, t + 0.8, [[0.9, 0.18], [1.15, 0.55], [1.9, 0.0001]]);
            var pan = c.createStereoPanner ? c.createStereoPanner() : c.createGain();
            if (pan.pan) {
                pan.pan.setValueAtTime(0.7, t + 0.8);
                pan.pan.linearRampToValueAtTime(-0.9, t + 2.4);
            }
            air.connect(bp).connect(ag).connect(pan);
            send(pan, 0.7, 0.5);
            air.start(t + 0.8);

            // 5) The flash: sub drop plus a soft noise thump, mostly into the hall.
            var sub = c.createOscillator();
            sub.type = "sine";
            sub.frequency.setValueAtTime(58, t + 2.15);
            sub.frequency.exponentialRampToValueAtTime(24, t + 3.6);
            var sg = c.createGain();
            env(sg, t + 2.12, [[0.04, 0.9], [1.6, 0.0001]]);
            sub.connect(sg);
            send(sg, 0.9, 0.25);
            sub.start(t + 2.1); sub.stop(t + 3.9);
            var thump = c.createBufferSource();
            thump.buffer = noiseBuffer(c, 1.2);
            var tlp = c.createBiquadFilter();
            tlp.type = "lowpass";
            tlp.frequency.setValueAtTime(900, t + 2.15);
            tlp.frequency.exponentialRampToValueAtTime(80, t + 3.2);
            var tg = c.createGain();
            env(tg, t + 2.13, [[0.02, 0.8], [1.0, 0.0001]]);
            thump.connect(tlp).connect(tg);
            send(tg, 0.5, 0.9);
            thump.start(t + 2.13);

            // 6) Afterglow: a slow, detuned sine pad that blooms out of the reverb into the menu.
            [110, 164.81, 220, 329.63].forEach(function (f, k) {
                [-4, 4].forEach(function (cents) {
                    var o = c.createOscillator();
                    o.type = "sine";
                    o.frequency.value = f;
                    o.detune.value = cents;
                    var g = c.createGain();
                    env(g, t + 2.3, [[1.2, 0.035 - k * 0.006], [2.6, 0.02], [4.5, 0.0001]]);
                    o.connect(g);
                    send(g, 0.4, 0.9);
                    o.start(t + 2.3); o.stop(t + 7.0);
                });
            });
        }

        function fadeMusic(to, ms) {
            if (!window.Howler) return;
            var from = Howler.volume();
            var start = performance.now();
            (function step(now) {
                var k = Math.min(1, (now - start) / ms);
                Howler.volume(from + (to - from) * k);
                if (k < 1) requestAnimationFrame(step);
            })(start);
        }

        return {
            fadeOutMusic: function (ms) {
                fadeMusic(0.0, ms);
            },
            play: function () {
                var c = ctx();
                if (!c) return;
                var go = function () { schedule(c); };
                if (c.state === "suspended") {
                    c.resume().then(go);
                } else {
                    go();
                }
            },
            restoreMusic: function () {
                fadeMusic(1, 2200);
            }
        };
    })();

    /*
     * Title scene: a still, breathing picture (the shuttle in its shield, the rift behind it,
     * debris drifting in) that comes alive when the player starts: engines ignite, the shuttle
     * tears past the camera, stars stretch, white flash, fade to black, then the menu.
     */
    var Scene = (function () {
        var cv = document.getElementById("scene");
        var g = cv.getContext("2d");
        var W = 0, H = 0, dpr = 1;
        var ship = new Image();
        var shield = new Image();
        ship.src = "assets/pics/load/menubackgroundburan.png";
        shield.src = "assets/pics/load/menubackgroundshield.png";
        var stars = [];
        var debris = [];
        var t0 = performance.now();
        var launchAt = -1;
        var onDone = null;
        var doneCalled = false;

        function rnd(a, b) { return a + Math.random() * (b - a); }

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            W = cv.clientWidth; H = cv.clientHeight;
            cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
            g.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener("resize", resize);
        resize();

        for (var i = 0; i < 320; i++) {
            stars.push({ x: Math.random(), y: Math.random(), z: rnd(0.15, 1), tw: rnd(0, 6.28), sp: rnd(0.5, 2.5) });
        }
        for (var k = 0; k < 26; k++) {
            debris.push({ a: rnd(0, 6.28), r: rnd(0.15, 0.55), s: rnd(2, 7), w: rnd(0.02, 0.08), spin: rnd(-1, 1) });
        }

        function sm(t, a, b) { var x = Math.max(0, Math.min(1, (t - a) / (b - a))); return x * x * (3 - 2 * x); }

        function frame(now) {
            var t = (now - t0) / 1000;
            var L = launchAt < 0 ? -1 : (now - launchAt) / 1000;
            var u = Math.min(W, H);

            // Launch timeline (seconds).
            var ignite = L < 0 ? 0 : sm(L, 0.15, 0.8);
            var fly = L < 0 ? 0 : sm(L, 0.8, 2.3);
            var flash = L < 0 ? 0 : Math.max(0, 1 - Math.abs(L - 2.15) / 0.3);
            var black = L < 0 ? 0 : sm(L, 2.2, 2.9);
            var shake = L < 0 ? 0 : (ignite * 3 + fly * 14) * (1 - black);

            g.save();
            if (shake > 0) g.translate(rnd(-shake, shake), rnd(-shake, shake));

            // Deep space.
            g.fillStyle = "#04050c";
            g.fillRect(-20, -20, W + 40, H + 40);
            var neb = g.createRadialGradient(W * 0.72, H * 0.38, 0, W * 0.72, H * 0.38, u * 0.9);
            neb.addColorStop(0, "rgba(36,80,126,0.32)"); neb.addColorStop(1, "rgba(36,80,126,0)");
            g.fillStyle = neb; g.fillRect(0, 0, W, H);
            var neb2 = g.createRadialGradient(W * 0.2, H * 0.8, 0, W * 0.2, H * 0.8, u * 0.7);
            neb2.addColorStop(0, "rgba(122,52,99,0.22)"); neb2.addColorStop(1, "rgba(122,52,99,0)");
            g.fillStyle = neb2; g.fillRect(0, 0, W, H);

            // Stars: twinkle while still, stretch into streaks during the launch.
            var vx = W * 0.62, vy = H * 0.5;
            var warp = fly * fly;
            for (var i = 0; i < stars.length; i++) {
                var st = stars[i];
                var x = st.x * W + Math.sin(t * 0.03 + st.z * 9) * 6 * st.z;
                var y = st.y * H;
                var a = 0.35 + 0.55 * (0.5 + 0.5 * Math.sin(t * st.sp + st.tw));
                var sz = 0.6 + st.z * 1.6;
                if (warp > 0.001) {
                    var dx = x - vx, dy = y - vy;
                    var len = warp * 0.9 * st.z;
                    g.strokeStyle = "rgba(220,235,255," + (0.5 + 0.5 * st.z) + ")";
                    g.lineWidth = sz;
                    g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx * len, y + dy * len); g.stroke();
                } else {
                    g.fillStyle = "rgba(255,255,255," + a * st.z + ")";
                    g.fillRect(x, y, sz, sz);
                }
            }

            // The rift: dark core, tilted accretion ring, halo. Flares up when the engines light.
            var rx = W * 0.84, ry = H * 0.24, rr = u * (0.16 + 0.04 * ignite);
            var halo = g.createRadialGradient(rx, ry, rr * 0.3, rx, ry, rr * 3.2);
            halo.addColorStop(0, "rgba(255,150,80," + (0.28 + 0.4 * ignite) + ")");
            halo.addColorStop(1, "rgba(255,120,60,0)");
            g.fillStyle = halo; g.fillRect(rx - rr * 3.2, ry - rr * 3.2, rr * 6.4, rr * 6.4);
            // Disk: back half, then the shadow, then the front half crossing in front of it;
            // the far side of the disk shows as a lensed arc over the top (Gargantua-like).
            function disk(front) {
                g.save();
                g.translate(rx, ry); g.rotate(-0.18);
                g.scale(1, 0.22);
                for (var ring = 0; ring < 4; ring++) {
                    var rad = rr * (1.05 + ring * 0.2);
                    var grad = g.createLinearGradient(-rad, 0, rad, 0);
                    var a0 = (0.95 - ring * 0.18) * (1 + 0.4 * ignite);
                    grad.addColorStop(0, "rgba(255,240,215," + a0 + ")");
                    grad.addColorStop(0.5, "rgba(255,150,70," + a0 * 0.7 + ")");
                    grad.addColorStop(1, "rgba(200,70,40," + a0 * 0.45 + ")");
                    g.strokeStyle = grad;
                    g.lineWidth = rr * (0.2 - ring * 0.035);
                    g.beginPath();
                    if (front) g.arc(0, 0, rad, 0, Math.PI); else g.arc(0, 0, rad, Math.PI, Math.PI * 2);
                    g.stroke();
                }
                g.restore();
            }
            disk(false);
            // Lensed far side: an arc hugging the shadow from above.
            var arcG = g.createRadialGradient(rx, ry, rr * 0.62, rx, ry, rr * 0.95);
            arcG.addColorStop(0, "rgba(255,225,180," + (0.9 + 0.1 * ignite) + ")");
            arcG.addColorStop(1, "rgba(255,140,60,0)");
            g.fillStyle = arcG;
            g.beginPath(); g.arc(rx, ry, rr * 0.95, Math.PI * 1.05, Math.PI * 1.95); g.arc(rx, ry, rr * 0.62, Math.PI * 1.95, Math.PI * 1.05, true); g.fill();
            g.fillStyle = "#000";
            g.beginPath(); g.arc(rx, ry, rr * 0.62, 0, Math.PI * 2); g.fill();
            g.strokeStyle = "rgba(255,225,190,0.9)"; g.lineWidth = Math.max(1, rr * 0.022);
            g.beginPath(); g.arc(rx, ry, rr * 0.645, 0, Math.PI * 2); g.stroke();
            disk(true);

            // Debris drifting into the rift.
            for (var d = 0; d < debris.length; d++) {
                var db = debris[d];
                db.a += 0.0016 / db.r; db.r -= 0.00005 * (1 + 6 * ignite);
                if (db.r < 0.08) { db.r = rnd(0.4, 0.6); db.a = rnd(0, 6.28); }
                var px = rx + Math.cos(db.a) * db.r * W * 0.6;
                var py = ry + Math.sin(db.a) * db.r * H * 0.35;
                g.save(); g.translate(px, py); g.rotate(t * db.spin);
                g.fillStyle = "rgba(90,100,120,0.8)";
                g.fillRect(-db.s / 2, -db.s / 2, db.s, db.s * 0.7);
                g.restore();
            }

            // The shuttle: hanging still, then lighting up and tearing past the camera.
            if (ship.complete && ship.naturalWidth) {
                var baseW = u * 0.42;
                var sw = baseW * (1 + fly * fly * 6);
                var sh = sw * ship.naturalHeight / ship.naturalWidth;
                var cx = W * 0.62 + Math.sin(t * 0.4) * 4 - fly * fly * W * 0.9;
                var cy = H * 0.52 + Math.sin(t * 0.7) * 6 + fly * fly * H * 0.75;
                var tilt = Math.sin(t * 0.3) * 0.03 - fly * 0.25;
                g.save(); g.translate(cx, cy); g.rotate(tilt);

                // Engine flames toward the upper right (the nose points lower left).
                if (ignite > 0) {
                    var fl = (0.7 + 0.3 * Math.random()) * ignite;
                    var nozzles = [[0.30, -0.10], [0.36, 0.08]];
                    for (var n = 0; n < nozzles.length; n++) {
                        var nx = nozzles[n][0] * sw, ny = nozzles[n][1] * sh;
                        var fx = nx + sw * 0.42 * fl, fy = ny - sw * 0.30 * fl;
                        var fg = g.createLinearGradient(nx, ny, fx, fy);
                        fg.addColorStop(0, "rgba(255,255,230,0.95)");
                        fg.addColorStop(0.35, "rgba(255,170,70,0.8)");
                        fg.addColorStop(1, "rgba(255,80,30,0)");
                        g.strokeStyle = fg; g.lineCap = "round";
                        g.lineWidth = sw * 0.035 * (0.8 + 0.4 * Math.random());
                        g.beginPath(); g.moveTo(nx, ny); g.lineTo(fx, fy); g.stroke();
                    }
                    var glow = g.createRadialGradient(sw * 0.33, 0, 0, sw * 0.33, 0, sw * 0.5);
                    glow.addColorStop(0, "rgba(255,180,90," + 0.45 * ignite + ")");
                    glow.addColorStop(1, "rgba(255,120,60,0)");
                    g.fillStyle = glow; g.fillRect(-sw, -sh, sw * 2, sh * 2);
                }
                g.drawImage(ship, -sw / 2, -sh / 2, sw, sh);

                // Shield: steady while idle, flickers out on ignition.
                var idleShield = 0.55 + 0.08 * Math.sin(t * 1.8);
                var shOn = L < 0 ? idleShield : idleShield * (1 - sm(L, 0.0, 0.7));
                var shGrow = L < 0 ? 1 : 1 + 0.12 * sm(L, 0.0, 0.7);
                if (shield.complete && shOn > 0) {
                    var ss = sw * 1.75 * shGrow;
                    g.globalAlpha = shOn;
                    g.drawImage(shield, -ss / 2, -ss / 2 * shield.naturalHeight / shield.naturalWidth, ss, ss * shield.naturalHeight / shield.naturalWidth);
                    g.globalAlpha = 1;
                }
                g.restore();
            }

            g.restore();

            // Vignette, flash, fade.
            var vig = g.createRadialGradient(W / 2, H / 2, u * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
            vig.addColorStop(0, "rgba(0,0,0,0)"); vig.addColorStop(1, "rgba(0,0,4,0.75)");
            g.fillStyle = vig; g.fillRect(0, 0, W, H);
            if (flash > 0) { g.fillStyle = "rgba(255,250,240," + flash + ")"; g.fillRect(0, 0, W, H); }
            if (black > 0) { g.fillStyle = "rgba(2,3,8," + black + ")"; g.fillRect(0, 0, W, H); }

            if (L > 2.95 && !doneCalled) {
                doneCalled = true;
                if (onDone) onDone();
            }
            if (!(L > 4)) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        return {
            launch: function (done) {
                launchAt = performance.now();
                onDone = done;
            }
        };
    })();
</script>
